[package]
name = "git-opt-sqlite"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "git-opt adapter: the persistence ports implemented with SQLite (sqlx)"

[dependencies]
git-opt-domain = { path = "../../domain" }
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
