[package]
name = "git-opt-http"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "git-opt driving adapter: the JSON API (axum) and the static web UI"

[dependencies]
git-opt-application = { path = "../../application" }
git-opt-domain = { path = "../../domain" }
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
