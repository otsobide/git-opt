[package]
name = "git-opt-codecs"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "git-opt format strategies: one lossless optimizer per file format, each behind a feature"

[features]
default = ["png", "jpeg", "gif", "webp", "ico", "icns", "svg", "svgz"]
png = ["dep:oxipng", "image/png"]
jpeg = ["dep:mozjpeg-sys", "image/jpeg"]
gif = ["dep:tempfile", "image/gif"]
webp = ["dep:libwebp-sys", "image/webp"]
ico = ["png"]
icns = ["png"]
svg = ["dep:resvg", "dep:roxmltree", "dep:xmlparser", "dep:base64", "image/png"]
svgz = ["svg", "dep:flate2", "dep:zopfli"]

[dependencies]
git-opt-domain = { path = "../domain" }
anyhow = "1.0.104"
async-trait = "0.1.92"
image = { version = "0.25.10", default-features = false }
tokio = { version = "1.54.1", features = ["rt", "process", "fs", "time"] }

base64 = { version = "0.23.1", optional = true }
flate2 = { version = "1.1", optional = true }
libwebp-sys = { version = "0.14", optional = true }
mozjpeg-sys = { version = "2.2.3", default-features = false, features = ["jpegtran", "unwinding", "parallel"], optional = true }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel", "zopfli"], optional = true }
resvg = { version = "0.49", default-features = false, features = ["raster-images"], optional = true }
roxmltree = { version = "0.21", optional = true }
tempfile = { version = "3.27.0", optional = true }
xmlparser = { version = "0.13", optional = true }
zopfli = { version = "0.8", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
png = "0.18"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
