name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: Rust (format, lint, test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Install gifsicle
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends gifsicle
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  codec-features:
    name: Codec features build alone
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - name: Check every feature on its own
        run: |
          cargo check -p git-opt-codecs --no-default-features --locked
          features=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "git-opt-codecs") | .features | keys[] | select(. != "default")')
          for feature in $features; do
            echo "::group::$feature"
            cargo check -p git-opt-codecs --no-default-features --features "$feature" --locked
            echo "::endgroup::"
          done

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the rust-version declared by the crates
        run: |
          msrv=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '[.packages[].rust_version] | unique | if length == 1 then .[0] else error("crates declare different rust-version values: \(.)") end')
          echo "rust-version: $msrv"
          rustup toolchain install "$msrv" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  frontend:
    name: UI (type-check, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  e2e:
    name: End-to-end (fake GitHub)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: rust:1.98-slim-trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git python3 curl imagemagick libmagickcore-7.q16-10-extra librsvg2-bin gifsicle
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: scripts/e2e.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: git-opt:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name git-opt -p 127.0.0.1:8484:8484 git-opt:ci
          for _ in $(seq 30); do curl -fs http://127.0.0.1:8484/api/health && break; sleep 1; done
          curl -fs http://127.0.0.1:8484/ | grep -q '<div id="app">'
          curl -fs http://127.0.0.1:8484/api/status > status.json
          jq '{version, git, optimizers: [.optimizers[] | {id, available, detail}]}' status.json
          jq -e '.git.version' status.json > /dev/null
          jq -e '[.optimizers[] | select(.available | not)] == []' status.json > /dev/null
      - name: Container logs
        if: always()
        run: docker logs git-opt || true
