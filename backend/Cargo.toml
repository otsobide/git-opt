[package]
name = "git-opt"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Self-hosted lossless image optimization bot for git repositories"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
dirs = "7.0.0"
fastrand = "2.5.0"
globset = "0.4.21"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif"] }
oxipng = { version = "10.2.1", default-features = false, features = ["parallel"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
